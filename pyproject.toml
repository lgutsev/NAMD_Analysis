[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namd-analysis"
version = "0.1.0"
description = "Analysis of saved CA-NAC / Hefei-NAMD output and VACF phonon spectra"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "L. Gutsev" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.scripts]
inamd-analysis = "namd_analysis.cli:main"
namd-analysis = "namd_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
namd_analysis = ["py.typed"]
