name: one-time fix rank test

on:
  push:
    branches: [feature/procar-character-populations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/procar-character-populations
      - name: Fix KineticFit rank-deficiency assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_kinetics.py')
          text = path.read_text()
          old = '        self.assertTrue(fit.jacobian_rank_deficient)\n'
          new = '        self.assertGreater(fit.jacobian_nullity, 0)\n'
          if old not in text:
              raise SystemExit('rank-deficiency assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_kinetics.py
          git commit -m "Fix rank-deficiency test assertion"
          git push origin HEAD:feature/procar-character-populations
