name: one-time fix test import

on:
  push:
    branches: [feature/procar-character-populations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/procar-character-populations
      - name: Add missing identifiability constant import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_kinetics.py')
          text = path.read_text()
          old = 'from namd_analysis.kinetics import (\n    KineticsError,\n'
          new = 'from namd_analysis.kinetics import (\n    KineticsError,\n    NULL_PARTICIPATION_LIMIT,\n'
          if old not in text:
              raise SystemExit('import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_kinetics.py
          git commit -m "Fix identifiability test import"
          git push origin HEAD:feature/procar-character-populations
