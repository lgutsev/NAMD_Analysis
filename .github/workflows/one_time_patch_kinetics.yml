name: one-time kinetics compatibility patch

on:
  push:
    branches: [feature/procar-character-populations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/procar-character-populations
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch spurious correlation partners
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/namd_analysis/kinetics.py')
          text = path.read_text()
          old = (
              "        partners: List[str] = []\n"
              "        if correlation is not None:\n"
              "            for other in range(len(edges)):\n"
              "                if other == index:\n"
              "                    continue\n"
              "                value = correlation[index, other]\n"
              "                if np.isfinite(value) and abs(value) >= DEGENERATE_CORRELATION:\n"
              "                    partners.append(names[other])\n"
          )
          new = (
              "        partners: List[str] = []\n"
              "        if correlation is not None and not bool(blind[index]) and null_ok:\n"
              "            for other in range(len(edges)):\n"
              "                if other == index:\n"
              "                    continue\n"
              "                # Correlations with a structurally unidentified direction are\n"
              "                # artifacts of the pseudo-inverse, not evidence that the\n"
              "                # identifiable rate is degenerate with that parameter. In\n"
              "                # particular, a discarded blind/null-space direction can carry\n"
              "                # an arbitrary covariance orientation that changes across\n"
              "                # LAPACK/NumPy versions. Such a parameter is already refused\n"
              "                # by the stronger blind/null-space checks above and must not\n"
              "                # contaminate otherwise identifiable rates.\n"
              "                if bool(blind[other]) or participation[other] > NULL_PARTICIPATION_LIMIT:\n"
              "                    continue\n"
              "                value = correlation[index, other]\n"
              "                if np.isfinite(value) and abs(value) >= DEGENERATE_CORRELATION:\n"
              "                    partners.append(names[other])\n"
          )
          if old not in text:
              raise SystemExit('target block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/namd_analysis/kinetics.py
          git commit -m "Stabilize identifiability correlations across NumPy versions"
          git push origin HEAD:feature/procar-character-populations
